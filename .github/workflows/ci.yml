name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    env:
      RUST_CHANNEL: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_CHANNEL" --profile minimal --component rustfmt
      - run: cargo "+$RUST_CHANNEL" fmt --all -- --check
      - run: cargo "+$RUST_CHANNEL" build
      - run: cargo "+$RUST_CHANNEL" test

  required-ci:
    name: Rust CI
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: ${{ always() }}
    needs: validate
    steps:
      - env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
